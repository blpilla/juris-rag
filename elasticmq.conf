include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = relaxed
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  juris-rag-ingestion-dlq { }
  juris-rag-ingestion {
    defaultVisibilityTimeout = 600 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "juris-rag-ingestion-dlq"
      maxReceiveCount = 5
    }
  }
}
