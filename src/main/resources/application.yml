spring:
  application:
    name: juris-rag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jurisrag}
    username: ${POSTGRES_USER:jurisrag}
    password: ${POSTGRES_PASSWORD:jurisrag-local-only}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  main:
    web-application-type: ${WEB_APPLICATION_TYPE:servlet}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: juris-rag
    distribution:
      percentiles-histogram:
        jurisrag.retrieval.latency: true
        jurisrag.generation.latency: true
        jurisrag.ingestion.latency: true

juris-rag:
  reference-date: ${REFERENCE_DATE:2026-11-01}
  queue:
    name: juris-rag-ingestion
    dead-letter-name: juris-rag-ingestion-dlq
    visibility-seconds: 600
    max-receive-count: 5
    poll-delay-ms: 500
  retrieval:
    lexical-limit: 10
    vector-limit: 10
    context-limit: 5
    rrf-k: 60
  embedding:
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    batch-size: 32
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chunking:
    target-characters: 1200
    overlap-characters: 180
  aws:
    region: ${AWS_REGION:us-east-1}
    sqs-endpoint: ${SQS_ENDPOINT:}
  jwt:
    issuer: ${JWT_ISSUER:juris-rag-local}
    audience: ${JWT_AUDIENCE:juris-rag-api}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:.local/jwt-public.pem}

logging:
  level:
    root: INFO
    br.com.jurisrag: INFO
    org.springframework.security: WARN
