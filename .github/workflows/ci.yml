name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode verify
      - name: Build container image
        run: docker build --tag juris-rag:ci .
