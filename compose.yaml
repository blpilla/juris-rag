services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jurisrag}
      POSTGRES_USER: ${POSTGRES_USER:-jurisrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisrag-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jurisrag} -d ${POSTGRES_DB:-jurisrag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmq-data:/data
  api:
    image: juris-rag:local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: "local,${AI_PROFILE:-deterministic},api"
      WEB_APPLICATION_TYPE: servlet
      APP_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jurisrag}
      POSTGRES_USER: ${POSTGRES_USER:-jurisrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisrag-local-only}
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      REFERENCE_DATE: ${REFERENCE_DATE:-2026-11-01}
      JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt-public.pem
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./.local/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  worker:
    image: juris-rag:local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: "local,${AI_PROFILE:-deterministic},worker"
      WEB_APPLICATION_TYPE: none
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jurisrag}
      POSTGRES_USER: ${POSTGRES_USER:-jurisrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisrag-local-only}
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      REFERENCE_DATE: ${REFERENCE_DATE:-2026-11-01}
    volumes:
      - ./.local/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 45s

  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  elasticmq-data:
  ollama-data:
